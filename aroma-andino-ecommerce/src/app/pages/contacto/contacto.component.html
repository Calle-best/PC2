<section class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <h2>Contacto</h2>
      <p class="text-muted">¿Dudas o sugerencias? Escríbenos.</p>

      <div *ngIf="enviado" class="alert alert-success">¡Gracias! Tu mensaje fue enviado.</div>

      <form (ngSubmit)="enviar()" #f="ngForm">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" name="nombre" [(ngModel)]="nombre" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Correo</label>
          <input type="email" class="form-control" name="correo" [(ngModel)]="correo" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Mensaje</label>
          <textarea rows="4" class="form-control" name="mensaje" [(ngModel)]="mensaje" required></textarea>
        </div>
        <button class="btn btn-andino" type="submit" [disabled]="f.invalid">Enviar mensaje</button>
      </form>
    </div>
  </div>
</section>
