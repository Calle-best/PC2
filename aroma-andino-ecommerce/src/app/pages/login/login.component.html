<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="mb-3 text-center">Iniciar sesión</h3>

          <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

          <form (ngSubmit)="iniciarSesion()">
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input class="form-control" name="usuario" [(ngModel)]="usuario" />
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" name="password" [(ngModel)]="password" />
            </div>
            <button class="btn btn-andino w-100" type="submit">Ingresar</button>
          </form>

          <p class="small text-muted text-center mt-3 mb-0">
            Demo: usuario <strong>admin</strong> · contraseña <strong>1234</strong>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
