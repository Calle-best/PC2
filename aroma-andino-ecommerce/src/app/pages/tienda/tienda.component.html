<section class="container py-4">
  <h2 class="mb-1">Tienda</h2>
  <p class="text-muted">Explora por categoría y descubre todo lo que tenemos para ti.</p>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-3" *ngFor="let s of secciones">
      <div class="card h-100 text-center shadow-sm">
        <div class="card-body">
          <i class="bi {{ s.icono }} display-4 text-terracotta"></i>
          <h5 class="mt-3">{{ s.nombre }}</h5>
          <p class="small text-muted">{{ s.texto }}</p>
          <a class="btn btn-andino btn-sm" routerLink="/productos"
             [queryParams]="{ categoria: s.nombre }">Ver productos</a>
        </div>
      </div>
    </div>
  </div>
</section>
